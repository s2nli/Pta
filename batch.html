<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">

<title>Batch — CODEX STUDYS</title>
<link rel="icon" href="assets/selectionway-icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/selectionway-icon-192.png">

<script>(function(){var t=localStorage.getItem("codex-studys-theme");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="lecture-player.css">
<style>
    :root {
      --bg: #080a0f;
      --bg-raised: #0d1017;
      --panel: rgba(17, 21, 31, .82);
      --panel-solid: #11151f;
      --panel-soft: #151b27;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .16);
      --text: #f4f6fb;
      --muted: #8d96a8;
      --muted-bright: #b4bdcd;
      --brand: #8b7cff;
      --brand-bright: #a69cff;
      --mint: #55ddbb;
      --orange: #ffb36b;
      --danger: #ff7585;
      --shadow: 0 24px 70px rgba(0, 0, 0, .32);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --max: 1240px;
    }

    html[data-theme="light"] {
      --bg: #f4f5f9; --bg-raised: #ffffff; --panel: rgba(255,255,255,.86); --panel-solid: #ffffff; --panel-soft: #eef0f6;
      --line: rgba(20,22,35,.1); --line-strong: rgba(20,22,35,.18); --text: #14161f; --muted: #5b6072; --muted-bright: #383c4a;
      --brand: #6c5ce7; --brand-bright: #5b46e0; --mint: #12b899; --orange: #d9832a; --danger: #e0344f;
      --shadow: 0 24px 70px rgba(30,30,60,.14);
    }
    html[data-theme="sandalwood"] {
      --bg: #1c130c; --bg-raised: #241a10; --panel: rgba(43,31,20,.82); --panel-solid: #2b1f14; --panel-soft: #332417;
      --line: rgba(255,225,190,.1); --line-strong: rgba(255,225,190,.18); --text: #f6ead9; --muted: #b89a7c; --muted-bright: #d9c1a3;
      --brand: #cd8a4a; --brand-bright: #e6a75f; --mint: #b58a4f; --orange: #ff9d4d; --danger: #ff7c6b;
    }
    html[data-theme="forest-emerald"] {
      --bg: #06140f; --bg-raised: #0a1c15; --panel: rgba(12,32,24,.82); --panel-solid: #0e2318; --panel-soft: #122a1d;
      --line: rgba(180,255,220,.09); --line-strong: rgba(180,255,220,.17); --text: #eafff3; --muted: #83b39c; --muted-bright: #aed7c1;
      --brand: #2fbf7a; --brand-bright: #3fdd91; --mint: #55ddbb; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="ocean-deep"] {
      --bg: #050e17; --bg-raised: #081521; --panel: rgba(11,26,40,.82); --panel-solid: #0c1e2e; --panel-soft: #102636;
      --line: rgba(170,225,255,.09); --line-strong: rgba(170,225,255,.17); --text: #eaf6ff; --muted: #7ea3bd; --muted-bright: #a9cbe0;
      --brand: #2196e0; --brand-bright: #4db4ff; --mint: #2fd3c7; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="sakura-blossom"] {
      --bg: #fff3f6; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ffe4ec;
      --line: rgba(180,40,80,.1); --line-strong: rgba(180,40,80,.18); --text: #3c1420; --muted: #a26478; --muted-bright: #7a3a4c;
      --brand: #ec6f96; --brand-bright: #e14f7e; --mint: #16b39a; --orange: #e08a3c; --danger: #d9314f;
    }
    html[data-theme="dracula-midnight"] {
      --bg: #14121f; --bg-raised: #1b1830; --panel: rgba(38,33,64,.82); --panel-solid: #241f3d; --panel-soft: #2b2549;
      --line: rgba(220,200,255,.09); --line-strong: rgba(220,200,255,.17); --text: #f3ecff; --muted: #a08fc9; --muted-bright: #c6b7ea;
      --brand: #bd93f9; --brand-bright: #d6acff; --mint: #50fa7b; --orange: #ffb86c; --danger: #ff5555;
    }
    html[data-theme="lavender-mist"] {
      --bg: #f5f2fc; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ece5fb;
      --line: rgba(80,50,140,.1); --line-strong: rgba(80,50,140,.18); --text: #2c2140; --muted: #7a6a9c; --muted-bright: #4d3d70;
      --brand: #9b7be0; --brand-bright: #855fdb; --mint: #16b39a; --orange: #d9832a; --danger: #d9314f;
    }
    html[data-theme="cyberpunk-neon"] {
      --bg: #05020a; --bg-raised: #0a0512; --panel: rgba(20,8,32,.85); --panel-solid: #150a22; --panel-soft: #1c0e2c;
      --line: rgba(255,60,220,.16); --line-strong: rgba(255,60,220,.3); --text: #f2e9ff; --muted: #b48ad9; --muted-bright: #e2b8ff;
      --brand: #ff2ec4; --brand-bright: #ff5be0; --mint: #2af5ff; --orange: #ffb36b; --danger: #ff3860;
    }
* { box-sizing: border-box; }
body { margin:0; min-width:320px; background: radial-gradient(circle at 78% 3%, rgba(139,124,255,.12), transparent 30rem), var(--bg); color:var(--text); font:15px/1.55 "DM Sans", sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:"Space Grotesk","DM Sans",sans-serif; margin:0; }
button { font:inherit; color:inherit; cursor:pointer; }
.topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--panel); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
.icon-btn { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--panel-soft); }
.icon-btn svg { width:18px; height:18px; }
.topbar h2 { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wrap { max-width:860px; margin:0 auto; padding:16px; }
.hero { border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; background:var(--panel); box-shadow:var(--shadow); }
.hero img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--panel-soft); }
.hero-body { padding:16px; }
.hero-body h1 { font-size:20px; line-height:1.3; }
.hero-body p { margin:6px 0 0; color:var(--muted-bright); font-size:13px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip { padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted-bright); background:rgba(255,255,255,.03); font-size:11px; font-weight:700; }
.chip-accent { color:var(--brand-bright); border-color:rgba(139,124,255,.35); background:rgba(139,124,255,.1); }
.chip-live { color:var(--danger); border-color:rgba(255,117,133,.4); background:rgba(255,117,133,.1); }
.tabs { display:flex; gap:8px; margin:16px 0 12px; }
.tab { flex:1; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--panel); color:var(--muted-bright); font-weight:700; font-size:13px; }
.tab.active { color:#fff; border-color:transparent; background:linear-gradient(135deg,#9487ff,#6c5bed); box-shadow:0 10px 24px rgba(109,91,237,.24); }
.panel { display:none; } .panel.active { display:block; }
.row { display:flex; align-items:center; gap:12px; padding:14px; margin-bottom:10px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--panel); cursor:pointer; transition:transform .2s, border-color .2s; }
.row:hover { transform:translateY(-2px); border-color:rgba(166,156,255,.42); }
.row-ico { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:11px; background:rgba(139,124,255,.12); color:var(--brand-bright); }
.row-ico svg { width:18px; height:18px; }
.row-info { flex:1; min-width:0; }
.row-title { font-weight:700; font-size:14px; line-height:1.35; }
.row-sub { color:var(--muted); font-size:12px; margin-top:2px; }
.row-arrow { color:var(--muted); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; border-radius:12px; border:1px solid transparent; font-weight:700; font-size:13px; color:#fff; background:linear-gradient(135deg,#9487ff,#6c5bed); }
.btn-ghost { color:var(--text); background:var(--panel-soft); border-color:var(--line); }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
.back-row { margin-bottom:12px; }
.sec-title { font-weight:700; font-size:15px; margin:0 0 12px; }
.class-card { border:1px solid var(--line); border-radius:var(--radius-md); background:var(--panel); margin-bottom:10px; padding:14px; }
.class-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.empty, .error { text-align:center; padding:36px 16px; color:var(--muted); }
.loader { width:30px; height:30px; margin:36px auto; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--brand-bright); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.about ul { margin:0 0 16px; padding-left:20px; color:var(--muted-bright); font-size:14px; }
.about li { margin-bottom:6px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="icon-btn" href="index.html" aria-label="Back to batches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></a>
  <h2 id="topTitle">Loading…</h2>
</header>
<main class="wrap">
  <section class="hero" id="hero"><div class="loader"></div></section>
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-tab="lectures">Lectures</button>
    <button class="tab" data-tab="notes">Notes</button>
    <button class="tab" data-tab="about">About</button>
  </div>
  <section class="panel active" id="tab-lectures"></section>
  <section class="panel" id="tab-notes"></section>
  <section class="panel about" id="tab-about"></section>
</main>


<script src="lecture-player.js"></script>
<script>
const API = "https://backend.multistreaming.site";
const $ = (s) => document.querySelector(s);
const esc = (v = "") => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
const ICON_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
const ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
const ARROW = '<svg class="row-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>';

const params = new URLSearchParams(location.search);
const batchId = params.get("id");
let lectureTopics = [], noteTopics = [];
let openLectureTopic = null, openNoteTopic = null;
let batchThumb = "", flatLectures = [], resumeLec = params.get("lec");

async function getJson(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error("Request failed (" + res.status + ")");
  const json = await res.json();
  if (json.state !== 200) throw new Error(json.message || "Request failed");
  return json.data;
}

async function init() {
  if (!batchId) { $("#hero").innerHTML = '<div class="error">Batch not found.</div>'; return; }
  try {
    const b = await getJson("/api/courses/" + encodeURIComponent(batchId));
    document.title = (b.title || "Batch") + " — CODEX STUDYS";
    $("#topTitle").textContent = b.title || "Batch";
    batchThumb = b.bannerSquare || b.banner || "";
    $("#hero").innerHTML = `
      <img src="${esc(b.banner || b.bannerSquare || "assets/codex-telegram.png")}" alt="" referrerpolicy="no-referrer" onerror="this.src='assets/codex-telegram.png'">
      <div class="hero-body">
        <h1>${esc(b.title)}</h1>
        ${b.short_description ? `<p>${esc(b.short_description)}</p>` : ""}
        <div class="chips">
          ${b.isLive ? '<span class="chip chip-live">● LIVE</span>' : ""}
          ${b.isRecorded ? '<span class="chip chip-accent">Recorded</span>' : ""}
          ${b.validity ? `<span class="chip">${esc(b.validity)}</span>` : ""}
        </div>
      </div>`;
    renderAbout(b);
    $("#tabs").style.display = "flex";
    loadLectures();
  } catch (e) {
    $("#hero").innerHTML = `<div class="error">Could not load this batch.<br><small>${esc(e.message)}</small></div>`;
  }
}

function renderAbout(b) {
  let h = "";
  if ((b.description || []).length) h += `<h3 class="sec-title">About this batch</h3><ul>${b.description.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>`;
  if ((b.courseHighlights || []).length) h += `<h3 class="sec-title">Highlights</h3><ul>${b.courseHighlights.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>`;
  if ((b.timeTable || []).length) h += `<h3 class="sec-title">Timetable</h3><ul>${b.timeTable.map((t) => `<li>${esc(t.topic)} — ${esc(t.time)}</li>`).join("")}</ul>`;
  $("#tab-about").innerHTML = h || '<div class="empty">No details available.</div>';
}

/* ---------- Lectures ---------- */
async function loadLectures() {
  const el = $("#tab-lectures");
  el.innerHTML = '<div class="loader"></div>';
  try {
    const data = await getJson(`/api/courses/${encodeURIComponent(batchId)}/classes?populate=full`);
    lectureTopics = (data.classes || []).filter((t) => (t.classes || []).length);
    let n = 0;
    lectureTopics.forEach((t) => { t.offset = n; n += t.classes.length; });
    flatLectures = lectureTopics.flatMap((t, ti) => t.classes.map((c, ci) => ({ ti, ci })));
    CXLP.setTotal(batchId, n);
    renderLectureTopics();
    if (resumeLec !== null && flatLectures[Number(resumeLec)]) {
      const f = flatLectures[Number(resumeLec)];
      renderLectures(f.ti);
      const url = lectureUrl(lectureTopics[f.ti].classes[f.ci]);
      if (url) playLecture(f.ti, f.ci, url);
    }
    resumeLec = null;
  } catch (e) { el.innerHTML = '<div class="error">Failed to load lectures.</div>'; }
}

function lectureUrl(c) { const s = classSources(c); return s.length ? s[0].url : (c.class_link || ""); }
function playLecture(ti, ci, url) {
  const t = lectureTopics[ti], c = t.classes[ci], idx = t.offset + ci;
  if (!/\.(mp4|m3u8|webm)(\?|$)/i.test(url) && !classSources(c).length) { openLink(url); return; }
  CXLP.play({ bid: batchId, idx, title: c.title || t.topicName, thumb: c.thumbnail || batchThumb, url });
}

function renderLectureTopics() {
  openLectureTopic = null;
  const el = $("#tab-lectures");
  if (!lectureTopics.length) { el.innerHTML = '<div class="empty">No lectures uploaded yet. Please check back later.</div>'; return; }
  el.innerHTML = lectureTopics.map((t, i) => `
    <div class="row" data-topic="${i}">
      <div class="row-ico">${ICON_VIDEO}</div>
      <div class="row-info"><div class="row-title">${esc(t.topicName)}</div><div class="row-sub">${t.classes.length} lecture${t.classes.length === 1 ? "" : "s"}</div></div>${ARROW}
    </div>`).join("");
  el.querySelectorAll(".row").forEach((r) => r.addEventListener("click", () => renderLectures(Number(r.dataset.topic))));
}

function classSources(cls) {
  const rank = (q) => { const n = parseInt(String(q || "").replace(/[^0-9]/g, ""), 10); return isNaN(n) ? 0 : n; };
  return (cls.mp4Recordings || []).filter((r) => r && r.url).sort((a, b) => rank(b.quality) - rank(a.quality));
}

function renderLectures(i) {
  openLectureTopic = i;
  const t = lectureTopics[i];
  const el = $("#tab-lectures");
  el.innerHTML = `<div class="back-row"><button class="btn btn-ghost" id="lecBack">← Back</button></div><h3 class="sec-title">${esc(t.topicName)}</h3><div class="lp-listwrap"></div>`;
  const wrap = el.querySelector(".lp-listwrap");
  wrap.innerHTML = CXLP.progressHTML(batchId, lectureTopics.reduce((a, x) => a + x.classes.length, 0)) +
    t.classes.map((c, ci) => {
      const idx = t.offset + ci, srcs = classSources(c), url = lectureUrl(c);
      const date = c.startDate ? new Date(c.startDate).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "";
      const done = CXLP.isDone(batchId, idx);
      const alt = srcs.length > 1 ? srcs.slice(1).map((r) => `<button class="btn btn-ghost" data-lalt="${ci}" data-url="${esc(r.url)}">▶ ${esc(r.quality || "Alt")}</button>`).join("") : "";
      const notes = (c.classPdf || []).map((p, pi) => `
        <button class="btn btn-ghost" data-open="${esc(p.url)}">📄 Notes</button>
        <button class="btn btn-ghost" data-dl="${esc(p.url)}" data-name="${esc((c.title || "notes") + ((c.classPdf || []).length > 1 ? " " + (pi + 1) : ""))}">⬇ Download</button>`).join("");
      return `<div class="lp-row${done ? " done" : ""}${url ? "" : " disabled"}" role="button" tabindex="0" data-lec="${idx}" data-ci="${ci}" data-ico="${esc(ICON_VIDEO)}">
        <div class="row-ico">${done ? CXLP.CHECK : ICON_VIDEO}</div>
        <div class="row-info"><div class="row-title">${esc(c.title)}</div><div class="row-sub">${[c.teacherName, date, url ? "" : "Recording soon"].filter(Boolean).map(esc).join(" · ")}</div></div>
        ${CXLP.checkBtn(batchId, idx)}
      </div>${alt || notes ? `<div class="lp-extra">${alt}${notes}</div>` : ""}`;
    }).join("");
  CXLP.bindRows(wrap, batchId, (row) => { const ci = Number(row.dataset.ci); playLecture(i, ci, lectureUrl(t.classes[ci])); });
  wrap.querySelectorAll("[data-lalt]").forEach((bt) => bt.addEventListener("click", () => playLecture(i, Number(bt.dataset.lalt), bt.dataset.url)));
  $("#lecBack").addEventListener("click", renderLectureTopics);
  window.scrollTo({ top: 0 });
}

/* ---------- Notes ---------- */
async function loadNotes() {
  const el = $("#tab-notes");
  if (noteTopics.length) return renderNoteTopics();
  el.innerHTML = '<div class="loader"></div>';
  try {
    const data = await getJson(`/api/courses/${encodeURIComponent(batchId)}/pdfs?groupBy=topic`);
    noteTopics = (data.topics || []).filter((t) => (t.pdfs || []).length);
    renderNoteTopics();
  } catch (e) { el.innerHTML = '<div class="error">Failed to load notes.</div>'; }
}

function renderNoteTopics() {
  const el = $("#tab-notes");
  if (!noteTopics.length) { el.innerHTML = '<div class="empty">No notes uploaded yet.</div>'; return; }
  el.innerHTML = noteTopics.map((t, i) => `
    <div class="row" data-topic="${i}">
      <div class="row-ico">${ICON_FILE}</div>
      <div class="row-info"><div class="row-title">${esc(t.topicName)}</div><div class="row-sub">${t.pdfs.length} PDF${t.pdfs.length === 1 ? "" : "s"}</div></div>${ARROW}
    </div>`).join("");
  el.querySelectorAll(".row").forEach((r) => r.addEventListener("click", () => renderNotes(Number(r.dataset.topic))));
}

function renderNotes(i) {
  const t = noteTopics[i];
  const el = $("#tab-notes");
  el.innerHTML = `<div class="back-row"><button class="btn btn-ghost" id="noteBack">← Back</button></div><h3 class="sec-title">${esc(t.topicName)}</h3>` +
    t.pdfs.map((p) => `<div class="class-card"><div class="row-title">${esc(p.title)}</div>${p.teacherName ? `<div class="row-sub">By ${esc(p.teacherName)}</div>` : ""}
      <div class="class-actions"><button class="btn" data-open="${esc(p.uploadPdf)}">View PDF</button><button class="btn btn-ghost" data-dl="${esc(p.uploadPdf)}" data-name="${esc(p.title)}">⬇ Download</button></div></div>`).join("");
  $("#noteBack").addEventListener("click", renderNoteTopics);
  window.scrollTo({ top: 0 });
}

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === tab));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "tab-" + tab.dataset.tab));
  if (tab.dataset.tab === "notes") loadNotes();
}));

/* ---------- Open / download (same behaviour as the Selection Way site) ---------- */
function openLink(url) { if (url) window.open(url, "_blank", "noopener,noreferrer"); }

async function downloadFile(url, name) {
  const safe = (String(name || "notes").replace(/[\\/:*?"<>|]+/g, " ").trim() || "notes") + ".pdf";
  try {
    const res = await fetch(url, { referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error("bad response");
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = safe;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) {
    // host blocks direct download -> open the file so it can be saved from the viewer
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.download = safe;
    document.body.appendChild(a); a.click(); a.remove();
  }
}

document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]"); if (o) { openLink(o.dataset.open); return; }
  const d = e.target.closest("[data-dl]"); if (d) { downloadFile(d.dataset.dl, d.dataset.name); }
});
